<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="太鼓台｜獅子舞 演目帳">
<meta name="theme-color" content="#101B2E">
<title>太鼓台｜獅子舞 演目帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ai:#101B2E; --ai-2:#1A2942; --line:#6E5A2C;
    --shu:#D4342C; --kin:#C8A047; --moegi:#7FA05A; --amber:#D6A24B;
    --kinari:#F2EDE1; --sumi:#B9B3A5;
    --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",YuMincho,"MS PMincho",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,sans-serif;
    --accent:var(--kin);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{height:-webkit-fill-available}
  html,body{height:100%}
  body{background:var(--ai);color:var(--kinari);font-family:var(--gothic);
       font-feature-settings:"palt" 1;overscroll-behavior:none;
       min-height:100dvh;min-height:-webkit-fill-available;-webkit-text-size-adjust:100%}
  button,select,input{font-family:inherit;color:inherit;font-size:16px}
  :focus-visible{outline:2px solid var(--kin);outline-offset:2px}
  .wrap{display:flex;flex-direction:column;min-height:100dvh;min-height:-webkit-fill-available;
        max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:8px;
       padding:13px 14px;border-bottom:1px solid var(--line);flex:none}
  .role{display:flex;align-items:center;gap:9px;font-family:var(--mincho);font-size:17px;letter-spacing:.16em;font-weight:700;min-width:0}
  .role::before{content:"";width:4px;height:19px;background:var(--accent);flex:none}
  .modesw{display:flex;gap:6px;flex:none}
  .modesw button{font-family:var(--mincho);font-size:12.5px;letter-spacing:.12em;font-weight:700;padding:7px 11px;
                 background:var(--ai-2);border:1px solid var(--line);color:var(--sumi);cursor:pointer}
  .modesw button[data-mode="omiya"][aria-pressed="true"]{border-color:var(--kin);color:#0E1626;background:var(--kin)}
  .modesw button[data-mode="shishi"][aria-pressed="true"]{border-color:var(--shu);color:#fff;background:var(--shu)}
  body[data-device="pad"] .modesw button{font-size:16px;padding:9px 16px}
  .side{display:flex;align-items:center;gap:12px;flex:none}
  .kumi{display:flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.14em;color:var(--sumi)}
  .kumi input{width:52px;background:var(--ai-2);border:1px solid var(--line);border-radius:0;
              padding:7px 6px;text-align:center;font-family:var(--mincho);font-size:14px;letter-spacing:.14em;color:var(--kin)}
  .conn{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.06em;color:var(--sumi)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;transition:background .3s}
  .dot.ok{background:var(--moegi)} .dot.ng{background:var(--shu)}
  .dot.wait{animation:bl 1.2s infinite}
  @keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}

  .body{flex:1;padding:20px 18px 24px;display:flex;flex-direction:column;min-height:0}
  .card{background:var(--ai-2);border:1px solid var(--line);padding:16px 15px}
  .cap{font-size:11px;letter-spacing:.18em;color:var(--sumi)}
  .btn{width:100%;padding:18px;border:none;cursor:pointer;background:var(--accent);color:#0E1626;
       font-family:var(--mincho);font-weight:700;font-size:17px;letter-spacing:.26em;text-indent:.26em}
  .btn.shu{background:var(--shu);color:#fff}
  .btn.moegi{background:var(--moegi);color:#0E1626}
  .btn:disabled{opacity:.32;cursor:default}
  .stack{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px}

  .status{margin-top:14px;padding:14px;border:1px dashed var(--line);text-align:center;font-size:13px;line-height:1.9;color:var(--sumi)}
  .status b{color:var(--kin);font-family:var(--mincho);font-size:16px;letter-spacing:.1em}

  /* ── 待機（モード選び） ── */
  .waitscreen{flex:1;display:flex;flex-direction:column;min-height:0}
  .waitwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;overflow:auto;padding:6px 0}
  .waitbox{border:1px dashed var(--line);padding:16px 14px;text-align:center}
  .waitbox b{font-family:var(--mincho);font-size:16px;letter-spacing:.12em;color:var(--kinari);display:block;margin-top:9px;font-weight:700}
  .waitbox p{font-size:11.5px;color:var(--sumi);line-height:1.9;margin-top:5px}
  .setrow{display:flex;justify-content:center}
  .setrow button{background:none;border:none;color:var(--kin);font-size:12px;letter-spacing:.12em;cursor:pointer;
                 text-decoration:underline;text-underline-offset:3px;padding:6px}

  .dev{display:flex;border:1px solid var(--line);flex:none}
  .dev button{background:none;border:none;color:var(--sumi);font-size:10.5px;letter-spacing:.06em;padding:7px 9px;cursor:pointer;font-family:var(--gothic)}
  .dev button[aria-pressed="true"]{background:var(--ai-2);color:var(--kin);font-weight:700}
  body[data-device="pad"] .dev button{font-size:13px;padding:9px 14px}

  .stage{flex:1;display:flex;flex-direction:column;min-height:0;gap:9px}
  .live{display:none;flex:none;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  body.livemode .live{display:block}
  body.livemode .dots{display:none}
  /* モード中は待機まわりの表示を隠して、札を最大に */
  body.livemode .kumi,body.livemode .conn,body.livemode .listbtn,body.livemode .nextup{display:none}
  body.livemode .bar{padding:7px 14px}
  body.livemode .body{padding:8px 14px 12px!important}
  body[data-device="pad"].livemode .bar{padding:6px 18px}
  body[data-device="pad"].livemode .body{padding:7px 18px 10px!important}
  body.livemode .meta{padding:6px 0 5px}
  body.livemode .reopen{padding:5px 0 0}
  .live-in{display:flex;gap:6px;padding:1px}
  .lchip{flex:none;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;color:var(--kinari);
         background:var(--ai-2);border:1px solid var(--line);border-left:3px solid var(--line);padding:9px 12px}
  .lchip .lb{font-family:var(--mincho);font-size:10.5px;color:var(--kin);letter-spacing:.08em}
  .lchip .ln{font-family:var(--mincho);font-size:15px;letter-spacing:.08em}
  .lchip.done{border-left-color:var(--moegi)}
  .lchip.done .ln{color:var(--sumi)}
  .lchip.now{border-color:var(--shu);border-left-color:var(--shu);background:#2A1B22}
  .lchip.now .ln{font-weight:800;color:#fff}
  .lchip.now .lb{color:#FF6259}
  /* iPad 縦：札を上、演目一覧を下に並べる */
  body[data-device="pad"] .live{overflow:auto;max-height:17vh}
  body[data-device="pad"] .live-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
  body[data-device="pad"] .lchip{white-space:normal;padding:9px 11px}
  body[data-device="pad"] .lchip .lb{font-size:11px;flex:none}
  body[data-device="pad"] .lchip .ln{font-size:17px}
  body[data-device="pad"] .stage{gap:9px}
  /* iPad 横：札を左、演目一覧を右に */
  @media (orientation:landscape){
    body[data-device="pad"] .stage{flex-direction:row}
    body[data-device="pad"] .live{width:200px;flex:none;max-height:none;height:100%}
    body[data-device="pad"] .live-in{grid-template-columns:1fr;align-content:start}
    body[data-device="pad"] .lchip{padding:9px 11px}
    body[data-device="pad"] .lchip .ln{font-size:17px}
  }
  .fuda{flex:1;display:flex;align-items:center;justify-content:center;margin:4px 0 0;background:#070D18;
        border:1px solid var(--line);box-shadow:inset 0 0 0 5px #070D18,inset 0 0 0 6px rgba(200,160,71,.34);min-height:0}
  .fuda-in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 10px;height:100%;width:100%}
  body[data-device="pad"] .fuda-in{gap:8px;padding:8px 10px}
  body[data-device="pad"] .fuda{box-shadow:inset 0 0 0 4px #070D18,inset 0 0 0 5px rgba(200,160,71,.34)}
  .n-ban{font-family:var(--mincho);font-weight:700;font-size:15px;letter-spacing:.4em;color:#FF6259;flex:none;text-indent:.4em}
  .n-name{font-family:var(--mincho);font-weight:800;font-size:clamp(40px,12vw,116px);
          letter-spacing:.12em;line-height:1.1;white-space:nowrap;color:#FFFFFF;text-indent:.12em;
          text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 34px rgba(212,52,44,.22)}
  .rise{animation:rise .34s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .meta{display:flex;align-items:center;gap:10px;padding:8px 0 7px}
  .dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}
  .d{width:7px;height:7px;background:var(--line);flex:none}
  .d.done{background:var(--moegi)} .d.now{background:var(--shu);width:20px}
  .nextup{text-align:center;font-size:12.5px;letter-spacing:.1em;color:#D5CFC1;padding:9px 0 11px;border-top:1px dashed var(--line)}
  .nextup b{font-family:var(--mincho);font-size:17px;color:var(--kin);letter-spacing:.14em}
  .count{display:flex;align-items:center;gap:6px;flex:none}
  .count button{width:38px;height:38px;flex:none;border:1px solid var(--line);background:var(--ai-2);color:var(--kin);font-size:17px;line-height:1;cursor:pointer}
  .count button:disabled{opacity:.26;cursor:default}
  .count .cv{font-family:var(--mincho);font-size:10.5px;letter-spacing:.1em;color:#D5CFC1;text-align:center;white-space:nowrap;padding:0 2px}
  .count .cv b{font-size:15px;color:var(--kin);letter-spacing:.1em}
  .count .pick{width:auto;padding:0 11px;font-family:var(--mincho);font-size:11.5px;letter-spacing:.1em}
  .addbar{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
  .pager{display:flex;gap:8px}
  .pager button{flex:1;padding:19px 4px;border:1px solid var(--line);background:var(--ai-2);font-family:var(--mincho);font-size:16px;letter-spacing:.2em;cursor:pointer}
  .pager .nx{flex:1.6;background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
  .pager button:disabled{opacity:.3;cursor:default}
  .pager .nx.fin{background:var(--moegi);border-color:var(--moegi);color:#0E1626}

  details{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  summary{font-size:12px;letter-spacing:.1em;color:var(--kin);cursor:pointer;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"⌵ ";color:var(--sumi)}
  .recvcode{display:flex;gap:8px;margin-top:6px}
  .recvcode input{flex:1;background:var(--ai);border:1px solid var(--line);border-radius:0;padding:13px 12px;
                  font-family:"SFMono-Regular",ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:.18em}
  .recvcode input::placeholder{color:var(--sumi);font-size:13px;letter-spacing:.06em}
  .recvcode button{flex:none;padding:0 16px;background:var(--moegi);border:none;color:#0E1626;font-family:var(--mincho);font-weight:700;font-size:14px;cursor:pointer}
  .reopen{display:flex;justify-content:center;padding:8px 0 2px}
  .reopen button{background:none;border:none;color:var(--kin);font-size:12px;letter-spacing:.1em;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  .listbtn{background:none;border:1px solid var(--line);color:var(--kin);font-size:11px;letter-spacing:.12em;padding:8px 11px;cursor:pointer}
  .sheet{position:fixed;inset:0;background:var(--ai);z-index:70;display:none;flex-direction:column;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .sheet.on{display:flex}
  .sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
  .sheet-bar b{font-family:var(--mincho);font-size:18px;letter-spacing:.2em;font-weight:700}
  .sheet-bar .tot{font-size:11px;letter-spacing:.12em;color:var(--sumi)}
  .sheet-close{background:none;border:none;color:var(--kin);font-size:28px;line-height:1;cursor:pointer;padding:2px 6px}
  .sheet-body{flex:1;overflow:auto;width:100%;max-width:820px;margin:0 auto;padding:12px 14px calc(26px + env(safe-area-inset-bottom))}
  .plist{list-style:none}
  .prow{display:flex;align-items:stretch;width:100%;
        background:var(--ai-2);border:1px solid var(--line);border-left:4px solid var(--line);margin-bottom:8px}
  .prow .pgo{flex:1;display:flex;align-items:center;gap:12px;min-width:0;text-align:left;cursor:pointer;
             background:none;border:none;color:inherit;padding:15px 14px}
  .prow .pdel{flex:none;width:48px;background:none;border:none;border-left:1px solid var(--line);
              color:var(--shu);font-size:18px;cursor:pointer}
  .prow .pdel:disabled{opacity:.25;cursor:default}
  .prow .pban{font-family:var(--mincho);font-weight:700;font-size:14px;color:var(--kin);width:46px;flex:none;text-align:center}
  .prow .pname{flex:1;font-family:var(--mincho);font-size:20px;letter-spacing:.12em;min-width:0}
  .prow .pst{font-size:11px;letter-spacing:.14em;color:var(--sumi);flex:none}
  .prow.done{border-left-color:var(--moegi)}
  .prow.done .pname{color:var(--sumi)} .prow.done .pst{color:var(--moegi)}
  .prow.now{border-color:var(--shu);border-left-color:var(--shu);background:#2A1B22}
  .prow.now .pban{color:var(--shu)} .prow.now .pname{color:var(--kinari);font-weight:800} .prow.now .pst{color:var(--shu);font-weight:700}

  /* ── 定型演目の設定 ── */
  .pbody{flex:1;overflow:auto;padding:14px 14px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:820px;margin:0 auto}
  .tabs{display:flex;gap:8px;margin-bottom:15px}
  .tabs button{flex:1;padding:13px 0;background:var(--ai-2);border:1px solid var(--line);color:var(--kinari);
               font-family:var(--mincho);font-size:16px;letter-spacing:.14em;cursor:pointer}
  .tabs button[aria-pressed="true"]{border-color:var(--kin);color:var(--kin);background:#1D2C46;font-weight:700}
  .chosen{list-style:none;display:flex;flex-direction:column;gap:7px}
  .crow{display:flex;align-items:center;gap:7px;background:var(--ai-2);border:1px solid var(--line);padding:9px 10px}
  .crow .cb{font-family:var(--mincho);font-weight:700;font-size:13px;color:var(--kin);width:42px;flex:none;text-align:center}
  .crow .cn{flex:1;font-family:var(--mincho);font-size:18px;letter-spacing:.1em;min-width:0}
  .crow button{width:40px;height:40px;flex:none;border:1px solid var(--line);background:none;color:var(--kin);font-size:15px;cursor:pointer}
  .crow button:disabled{opacity:.25;cursor:default}
  .crow button.del{color:var(--shu);border-color:#5B2C2A}
  .empt{border:1px dashed var(--line);color:var(--sumi);font-size:12.5px;line-height:1.9;text-align:center;padding:20px 14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .chips button{background:var(--ai);border:1px solid var(--line);color:var(--kinari);font-family:var(--mincho);
                font-size:15px;letter-spacing:.08em;padding:10px 13px;cursor:pointer}
  .chips button:active{border-color:var(--kin);color:var(--kin)}
  .pact{display:flex;gap:9px;margin-top:20px}
  .pact button{flex:1;padding:15px 0;border:1px solid var(--line);background:none;color:var(--kin);
               font-family:var(--mincho);font-size:15px;letter-spacing:.16em;cursor:pointer}
  .pact .save{flex:1.5;background:var(--moegi);border-color:var(--moegi);color:#0E1626;font-weight:700}
  .pnote{margin-top:16px;font-size:11.5px;line-height:1.95;color:var(--sumi)}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:#0E1626;border:1px solid var(--kin);color:var(--kinari);padding:12px 18px;font-size:13px;letter-spacing:.06em;
         z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
  .toast.on{opacity:1}

  /* ── iPad・大きい画面 ── */
  body[data-device="pad"] .wrap{max-width:940px}body[data-device="pad"] .bar{padding:10px 20px}body[data-device="pad"] .role{font-size:18px;letter-spacing:.18em}body[data-device="pad"] .role::before{width:5px;height:25px}body[data-device="pad"] .kumi{font-size:12px}body[data-device="pad"] .kumi input{width:64px;font-size:16px;padding:9px 6px}body[data-device="pad"] .conn{font-size:11.5px}body[data-device="pad"] .listbtn{font-size:13px;padding:11px 15px}body[data-device="pad"] .body{padding:10px 20px 14px!important}body[data-device="pad"] .waitbox b{font-size:21px}body[data-device="pad"] .waitbox p{font-size:14px}body[data-device="pad"] .setrow button{font-size:14px}body[data-device="pad"] .n-ban{font-size:21px}body[data-device="pad"] .d{width:9px;height:9px}body[data-device="pad"] .d.now{width:26px}body[data-device="pad"] .nextup{font-size:15px;padding:8px 0 10px}body[data-device="pad"] .nextup b{font-size:22px}body[data-device="pad"] .pager button{padding:17px 6px;font-size:19px}body[data-device="pad"] .reopen button{font-size:14px}body[data-device="pad"] .reopen{padding:6px 0 0}body[data-device="pad"] .sheet-bar b{font-size:22px}body[data-device="pad"] .sheet-bar .tot{font-size:13px}body[data-device="pad"] .prow .pgo{padding:20px 18px}body[data-device="pad"] .prow .pname{font-size:24px}body[data-device="pad"] .prow .pban{font-size:16px;width:54px}body[data-device="pad"] .prow .pst{font-size:13px}body[data-device="pad"] .prow .pdel{width:60px;font-size:22px}body[data-device="pad"] .count{gap:9px}body[data-device="pad"] .count button{width:42px;height:42px;font-size:20px}body[data-device="pad"] .count .cv{font-size:13px}body[data-device="pad"] .count .cv b{font-size:21px}body[data-device="pad"] .count .pick{padding:0 16px;font-size:15px}body[data-device="pad"] .meta{padding:7px 0 6px}body[data-device="pad"] .tabs button{padding:16px 0;font-size:19px}body[data-device="pad"] .crow{padding:12px 12px}body[data-device="pad"] .crow .cn{font-size:21px}body[data-device="pad"] .crow button{width:46px;height:46px;font-size:17px}body[data-device="pad"] .chips button{font-size:18px;padding:12px 16px}body[data-device="pad"] .pact button{padding:18px 0;font-size:17px}body[data-device="pad"] .pnote{font-size:13.5px}body[data-device="pad"] .recvcode input{font-size:22px;padding:15px 14px}body[data-device="pad"] .recvcode button{font-size:16px;padding:0 20px}body[data-device="pad"] .toast{font-size:15px;padding:14px 22px}
  
  @media (min-width:1000px){ body[data-device="pad"] .wrap{max-width:1180px} }
  /* 横向きの iPad は札を目一杯に */
  @media (orientation:landscape){
body[data-device="pad"] .body{padding:14px 28px 18px!important}body[data-device="pad"] .dots{padding:10px 0 6px}body[data-device="pad"] .nextup{padding:10px 0 12px}body[data-device="pad"] .pager button{padding:20px 6px}
  
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar" id="topbar" style="--accent:var(--moegi)">
    <div class="role">太鼓台</div>
    <div class="modesw" id="modesw">
      <button data-mode="omiya" aria-pressed="false">お宮</button>
      <button data-mode="shishi" aria-pressed="false">獅子殺し</button>
    </div>
    <div class="side">
      <div class="dev" id="dev">
        <button data-d="phone" aria-pressed="false">iPhone</button>
        <button data-d="pad" aria-pressed="false">iPad</button>
      </div>
      <button class="listbtn" id="listBtn" hidden>演目一覧</button>
      <div class="kumi">組<input id="kumiIn" value="01" maxlength="6" inputmode="text" autocomplete="off" autocapitalize="off"></div>
      <div class="conn"><i class="dot wait" id="dot"></i><span id="stat">—</span></div>
    </div>
  </div>
  <div class="body" style="padding:14px 16px 18px">
    <div id="wait" class="waitscreen">
      <div class="waitwrap">
        <div class="waitbox">

          <b>演者からの演目を待っています</b>

          <details style="width:100%;max-width:360px;margin:12px auto 0">
            <summary>つながらないとき（コードを入れる）</summary>

  <div class="sheet-bar">

  </div>

<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";

  var DEFAULT_ENMOKU=["三つ","二つ","一つ","ギョンブ","やっさぶ","オカムラ","きょうぶ","かいちゅう","六尺","宮入り","宮出","三崩し"];
  /* お宮・獅子殺しの初期の並び（画面の「定型演目の設定」でいつでも直せます） */
  var PRESET_DEF={
    omiya:["宮入り","三つ","二つ","一つ","三崩し","宮出"],
    shishi:["ギョンブ","やっさぶ","オカムラ","きょうぶ","かいちゅう","六尺"]
  };
  var PRESET_LABEL={omiya:"お宮",shishi:"獅子殺し"};
  var SUJI=["","一","二","三","四","五","六","七","八","九"];
  var CH="0123456789abcdefghijklmnopqrstuvwxyz";
  function kanNum(n){
    if(n<1) return String(n);
    if(n<10) return SUJI[n];
    if(n<100){ var t=Math.floor(n/10), o=n%10; return (t>1?SUJI[t]:"")+"十"+(o?SUJI[o]:""); }
    return String(n);
  }
  function kan(i){ return kanNum(i+1); }
  function $(id){ return document.getElementById(id); }
  function lset(k,v){ try{ localStorage.setItem("shishimai:"+k,v); }catch(e){} }
  function lget(k){ try{ return localStorage.getItem("shishimai:"+k); }catch(e){ return null; } }

  var MENU=(function(){ try{ var a=JSON.parse(lget("enmoku")); if(a&&a.length) return a.slice(); }catch(e){} return DEFAULT_ENMOKU.slice(); })();
  var presets=(function(){
    try{ var o=JSON.parse(lget("presets")); if(o&&o.omiya&&o.shishi) return {omiya:o.omiya.slice(),shishi:o.shishi.slice()}; }catch(e){}
    return {omiya:PRESET_DEF.omiya.slice(),shishi:PRESET_DEF.shishi.slice()};
  })();
  function savePresets(){ lset("presets",JSON.stringify(presets)); updateCounts(); }

  function progToCode(list){ return list.map(function(n){ var i=MENU.indexOf(n); return i>=0?CH.charAt(i):""; }).join(""); }
  function codeToProg(code){ code=(code||"").toLowerCase().replace(/[^0-9a-z]/g,""); var o=[];
    for(var i=0;i<code.length;i++){ var k=CH.indexOf(code.charAt(i)); if(k>=0&&MENU[k]) o.push(MENU[k]); } return o; }
  var _tt=null; function toast(m){ var t=$("toast"); if(!t) return; t.textContent=m; t.classList.add("on");
    clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove("on"); },2400); }

  /* ── 中継（公開MQTTブローカー） ── */
  var BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];
  var Sync=(function(){
    var client=null, kumi="01", cbs={}, bi=0, ready=false;
    function base(){ return "shishimai/enmoku/"+kumi+"/"; }
    function setDot(cls,txt){ var d=$("dot"),s=$("stat"); if(d){ d.className="dot "+cls; } if(s){ s.textContent=txt; } }
    function topics(){ var t=[]; var r=cbs.roles||[];
      if(r.indexOf("shugi")>=0) t.push(base()+"shugi");
      if(r.indexOf("program")>=0) t.push(base()+"program");
      if(r.indexOf("state")>=0) t.push(base()+"state");
      if(r.indexOf("enmoku")>=0) t.push(base()+"enmoku");
      return t; }
    function sub(){ var t=topics(); if(client&&t.length) client.subscribe(t,{qos:1}); }
    function connect(){
      setDot("wait","接続中…");
      var url=BROKERS[bi%BROKERS.length];
      try{
        client=mqtt.connect(url,{clientId:"ssm_"+Math.random().toString(16).slice(2,10),
          clean:true,keepalive:30,reconnectPeriod:2500,connectTimeout:8000});
      }catch(e){ setDot("ng","接続できません"); return; }
      client.on("connect",function(){ ready=true; setDot("ok","接続済み"); sub(); if(cbs.onReady) cbs.onReady(); });
      client.on("reconnect",function(){ setDot("wait","再接続中…"); });
      client.on("close",function(){ if(ready) setDot("ng","切れました"); });
      client.on("error",function(){ setDot("ng","接続エラー");
        bi++; try{ client.end(true); }catch(e){} setTimeout(connect,1500); });
      client.on("message",function(topic,payload){
        var msg; try{ msg=JSON.parse(payload.toString()); }catch(e){ return; }
        var suf=topic.slice(base().length);
        if(suf==="shugi"&&cbs.onShugi) cbs.onShugi(msg);
        if(suf==="program"&&cbs.onProgram) cbs.onProgram(msg);
        if(suf==="state"&&cbs.onState) cbs.onState(msg);
        if(suf==="enmoku"&&cbs.onEnmoku) cbs.onEnmoku(msg);
      });
    }
    return {
      init:function(k,c){ kumi=k||"01"; cbs=c||{};
        if(typeof mqtt==="undefined"){ setDot("ng","中継を読めません"); return; } connect(); },
      setKumi:function(k){ if(k===kumi) return; try{ if(client) client.unsubscribe(topics()); }catch(e){} kumi=k; sub(); },
      pub:function(suf,obj){ if(!client) return; obj.at=Date.now();
        try{ client.publish(base()+suf,JSON.stringify(obj),{qos:1,retain:true}); }catch(e){} },
      clearRetain:function(suf){ if(client){ try{ client.publish(base()+suf,"",{qos:1,retain:true}); }catch(e){} } }
    };
  })();

  /* mqtt.js をCDNから読み込む（jsDelivr→unpkg） */
  function loadMqtt(done){
    if(typeof mqtt!=="undefined"){ done(); return; }
    var srcs=["https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js","https://unpkg.com/mqtt@5/dist/mqtt.min.js"];
    var i=0;
    (function tryNext(){
      if(i>=srcs.length){ done(); return; }
      var s=document.createElement("script"); s.src=srcs[i++];
      s.onload=function(){ done(); }; s.onerror=tryNext; document.head.appendChild(s);
    })();
  }

  var kumi=(lget("kumi")||"01");
  var kIn=$("kumiIn"); kIn.value=kumi;
  kIn.addEventListener("change",function(){ kumi=(kIn.value.trim()||"01"); kIn.value=kumi; lset("kumi",kumi); Sync.setKumi(kumi); });

  /* ── 端末えらび（iPhone / iPad） ── */
  var device=lget("device");
  if(device!=="phone"&&device!=="pad"){
    device=(/iPad/.test(navigator.userAgent)||(!/iPhone|Android/.test(navigator.userAgent)&&Math.min(screen.width,screen.height)>=700))?"pad":"phone";
  }
  function applyDevice(){
    document.body.setAttribute("data-device",device);
    Array.prototype.forEach.call($("dev").querySelectorAll("button"),function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-d")===device?"true":"false");
    });
    setTimeout(function(){ if(list.length) fitName(); },60);
  }
  Array.prototype.forEach.call(document.querySelectorAll("#dev button"),function(b){
    b.addEventListener("click",function(){ device=b.getAttribute("data-d"); lset("device",device); applyDevice(); });
  });

  var list=[], base=[], cur=0, round=0, wake=null, mode=null, pending=null;
  function keepWake(){ try{ if(navigator.wakeLock&&navigator.wakeLock.request)
    navigator.wakeLock.request("screen").then(function(w){ wake=w; }).catch(function(){}); }catch(e){} }
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&list.length) keepWake(); });

  function renderLive(){
    if(!mode){ document.body.classList.remove("livemode"); return; }
    document.body.classList.add("livemode");
    var done=cur>=list.length, wrap=$("liveIn"), now=null;
    wrap.innerHTML="";
    list.forEach(function(nm,k){
      var b=document.createElement("button"); b.type="button";
      b.className="lchip"+(!done&&k===cur?" now":(k<cur?" done":""));
      b.innerHTML='<span class="lb">'+kan(k)+'番</span><span class="ln"></span>';
      b.querySelector(".ln").textContent=nm;
      b.addEventListener("click",function(){ cur=k; draw(true); });
      if(!done&&k===cur) now=b;
      wrap.appendChild(b);
    });
    if(now&&now.scrollIntoView){ try{ now.scrollIntoView({block:"nearest",inline:"center"}); }catch(e){} }
  }

  function applyMode(){
    var bar=$("topbar");
    Array.prototype.forEach.call($("modesw").querySelectorAll("button"),function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-mode")===mode?"true":"false");
    });
    if(mode){
      bar.style.setProperty("--accent", mode==="omiya"?"var(--kin)":"var(--shu)");
      $("reopen").textContent="モードをえらび直す";
    }else{
      bar.style.setProperty("--accent","var(--moegi)");
      $("reopen").textContent="待機に戻る";
    }
  }

  function load(newList,newRound,announce,m){
    if(!newList.length){ return; }
    mode=m||null; list=newList.slice(); base=newList.slice(); cur=0; round=newRound||Date.now();
    applyMode();
    $("wait").hidden=true; $("stage").hidden=false; $("ctrl").hidden=false;
    draw(true); keepWake(); pubState();
    if(announce) toast(list.length+"演目を読み込みました");
  }
  function pubState(){ if(mode) return; var done=cur>=list.length;
    Sync.pub("state",{round:round,i:Math.min(cur,list.length-1),done:done}); }

  /* ── 演目の数を増やす・減らす ── */
  function setCount(n){
    if(!base.length) return;
    n=Math.max(1,Math.min(base.length,n));
    if(n===list.length) return;
    list=base.slice(0,n);
    if(cur>list.length) cur=list.length;
    draw(true); pubState();
    toast("全"+kan(list.length-1)+"演目にしました");
  }
  function addEnmoku(nm){
    base=list.slice(); base.push(nm); list=base.slice();
    draw(true); pubState();
  }
  function removeAt(k){
    if(list.length<=1){ toast("演目はひとつ残ります"); return; }
    base=list.slice(); base.splice(k,1); list=base.slice();
    if(cur>=list.length) cur=list.length-1;
    draw(true); pubState();
  }
  function drawCount(){
    var n=list.length;
    $("cVal").innerHTML='演目 <b>全'+kan(n-1)+'</b> 演目';
    $("cMinus").disabled=(n<=1);
  }
  $("cMinus").addEventListener("click",function(){
    if(list.length<=1){ return; }
    setCount(list.length-1);
  });
  function nextEnmoku(){
    for(var i=0;i<MENU.length;i++){ if(list.indexOf(MENU[i])<0) return MENU[i]; }
    return MENU[0]||"演目";
  }
  $("cPlus").addEventListener("click",function(){
    if(base.length>list.length){ setCount(list.length+1); return; }   /* 減らした分はまず元に戻す */
    var nm=nextEnmoku();
    addEnmoku(nm);
    toast(nm+"　を足しました（全"+kan(list.length-1)+"演目）");
  });
  $("cPick").addEventListener("click",function(){ openAdd(); });

  /* ── 演目を足す画面 ── */
  function renderAdd(){
    $("addTot").textContent="いま 全"+kan(list.length-1)+"演目";
    var wrap=$("addchips"); wrap.innerHTML="";
    MENU.forEach(function(nm){
      var b=document.createElement("button"); b.type="button"; b.textContent=nm;
      b.addEventListener("click",function(){ addEnmoku(nm); renderAdd(); toast(nm+"　を足しました"); });
      wrap.appendChild(b);
    });
  }
  function openAdd(){ if(!list.length) return; renderAdd(); $("addSheet").classList.add("on"); }
  function closeAdd(){ $("addSheet").classList.remove("on"); }
  $("addClose").addEventListener("click",closeAdd);
  $("addDone").addEventListener("click",closeAdd);

  function startPreset(key){
    var l=(presets[key]||[]).filter(Boolean);
    if(!l.length){ toast("「"+PRESET_LABEL[key]+"」の演目がまだ決まっていません"); openPset(key); return; }
    pending=null; load(l,Date.now(),false,key);
    toast(PRESET_LABEL[key]+"　全"+l.length+"演目");
  }
  Array.prototype.forEach.call(document.querySelectorAll("#modesw button"),function(b){
    b.addEventListener("click",function(){
      var k=b.getAttribute("data-mode");
      if(mode===k&&list.length){ toast(PRESET_LABEL[k]+"モードで表示中です"); return; }
      startPreset(k);
    });
  });
  function updateCounts(){
    ["omiya","shishi"].forEach(function(k){
      var n=(presets[k]||[]).filter(Boolean).length;
      var el=$("cnt-"+k); if(el) el.textContent=n?("全"+n+"演目"):"未設定";
    });
  }
  updateCounts();

  /* ── 演目名を枠に自動フィット（iPadの大きな画面にも合わせて拡大） ── */
  /* 演目名の大きさは「いちばん長い演目」に合わせて固定する（名前で窓の見え方が変わらない） */
  function measureFit(el,availH,availW,maxs){
    var size=Math.min(maxs,Math.max(24,Math.floor(availH)));
    el.style.fontSize=size+"px";
    var h=el.offsetHeight,w=el.offsetWidth;
    if(h>0&&w>0){
      var r=Math.min(availH/h,availW/w);
      size=Math.max(20,Math.min(maxs,Math.floor(size*r)));
      el.style.fontSize=size+"px";
    }
    var guard=0;
    while(guard++<80 && size>20 && (el.offsetHeight>availH||el.offsetWidth>availW)){ size-=2; el.style.fontSize=size+"px"; }
    while(guard++<200 && size<maxs){
      var t=size+2; el.style.fontSize=t+"px";
      if(el.offsetHeight>availH||el.offsetWidth>availW){ el.style.fontSize=size+"px"; break; }
      size=t;
    }
    return size;
  }
  function longestName(){
    var best=list.length?list[0]:"了";
    list.forEach(function(nm){ if(nm.length>best.length) best=nm; });
    return best.length>=1?best:"了";
  }
  function fitName(){
    var box=$("fuda"), el=$("name");
    if(!box||!el||$("stage").hidden) return;
    var inner=box.querySelector(".fuda-in"); if(!inner) return;
    var ban=$("ban");
    var pad=document.body.getAttribute("data-device")==="pad";
    var availH=inner.clientHeight-(ban?ban.offsetHeight:0)-(pad?16:24);
    var availW=inner.clientWidth-(pad?18:22);
    if(availH<=0||availW<=0) return;
    var keep=el.textContent;
    el.textContent=longestName();
    var size=measureFit(el,availH,availW,pad?1000:520);
    el.textContent=keep;
    el.style.fontSize=size+"px";
  }

  var _rt=null;
  function relayout(){ if(list.length){ clearTimeout(_rt); _rt=setTimeout(fitName,120); } }
  window.addEventListener("resize",relayout);
  window.addEventListener("orientationchange",function(){ setTimeout(relayout,260); });
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){ if(list.length) fitName(); }); }

  /* ── 演目一覧 ── */
  function renderList(){
    var done=cur>=list.length;
    $("sheetTot").textContent=list.length?((mode?PRESET_LABEL[mode]+"　":"")+(done?"全"+list.length+"演目 おわり":(Math.min(cur,list.length-1)+1)+" ／ "+list.length)):"";
    var ul=$("plist"); ul.innerHTML="";
    list.forEach(function(nm,k){
      var li=document.createElement("li");
      li.className="prow"+(!done&&k===cur?" now":(k<cur?" done":""));
      li.innerHTML='<button class="pgo"><span class="pban">'+kan(k)+'番</span><span class="pname"></span><span class="pst"></span></button>'+
                   '<button class="pdel" aria-label="この演目をはずす">×</button>';
      li.querySelector(".pname").textContent=nm;
      li.querySelector(".pst").textContent=(!done&&k===cur)?"いま":(k<cur?"済":"");
      li.querySelector(".pgo").addEventListener("click",function(){ cur=k; draw(true); pubState(); closeList(); });
      var del=li.querySelector(".pdel");
      del.disabled=(list.length<=1);
      del.addEventListener("click",function(){ removeAt(k); });
      ul.appendChild(li);
    });
  }
  function openList(){ if(!list.length) return; renderList(); $("sheet").classList.add("on"); }
  function closeList(){ $("sheet").classList.remove("on"); }
  $("listBtn").addEventListener("click",openList);
  $("listAdd").addEventListener("click",function(){ closeList(); openAdd(); });
  $("sheetClose").addEventListener("click",closeList);

  /* ── 定型演目の設定 ── */
  var editKey="omiya";
  function renderPset(){
    Array.prototype.forEach.call($("psetTabs").querySelectorAll("button"),function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-t")===editKey ? "true":"false");
    });
    var arr=presets[editKey]||[];
    $("psetTot").textContent=arr.length?("全"+arr.length+"演目"):"未設定";
    var ol=$("chosen"); ol.innerHTML="";
    if(!arr.length){
      var li=document.createElement("li"); li.className="empt";
      li.textContent="まだ演目がありません。下の演目をおして、舞う順に足してください。";
      ol.appendChild(li);
    }
    arr.forEach(function(nm,i){
      var li=document.createElement("li"); li.className="crow";
      li.innerHTML='<span class="cb">'+kan(i)+'番</span><span class="cn"></span>'+
        '<button class="up" aria-label="ひとつ上へ">▲</button>'+
        '<button class="dn" aria-label="ひとつ下へ">▼</button>'+
        '<button class="del" aria-label="はずす">×</button>';
      li.querySelector(".cn").textContent=nm;
      var up=li.querySelector(".up"), dn=li.querySelector(".dn");
      up.disabled=(i===0); dn.disabled=(i===arr.length-1);
      up.addEventListener("click",function(){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; savePresets(); renderPset(); });
      dn.addEventListener("click",function(){ var t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; savePresets(); renderPset(); });
      li.querySelector(".del").addEventListener("click",function(){ arr.splice(i,1); savePresets(); renderPset(); });
      ol.appendChild(li);
    });
    var wrap=$("chips"); wrap.innerHTML="";
    MENU.forEach(function(nm){
      var b=document.createElement("button"); b.type="button"; b.textContent=nm;
      b.addEventListener("click",function(){
        arr.push(nm); savePresets(); renderPset();
      });
      wrap.appendChild(b);
    });
  }
  function openPset(key){ editKey=key||editKey; renderPset(); $("pset").classList.add("on"); }
  function closePset(){ $("pset").classList.remove("on"); }
  $("psetBtn").addEventListener("click",function(){ openPset(editKey); });
  $("psetClose").addEventListener("click",closePset);
  $("psetDone").addEventListener("click",closePset);
  Array.prototype.forEach.call($("psetTabs").querySelectorAll("button"),function(b){
    b.addEventListener("click",function(){ editKey=b.getAttribute("data-t"); renderPset(); });
  });
  $("psetReset").addEventListener("click",function(){
    presets[editKey]=PRESET_DEF[editKey].slice(); savePresets(); renderPset();
    toast(PRESET_LABEL[editKey]+"を初期の並びに戻しました");
  });

  function draw(animate){
    if(!list.length){ $("wait").hidden=false; $("stage").hidden=true; $("ctrl").hidden=true; $("listBtn").hidden=true;
      document.body.classList.remove("livemode"); return; }
    $("listBtn").hidden=false;
    if($("sheet").classList.contains("on")) renderList();
    var done=cur>=list.length, i=Math.min(cur,list.length-1);
    var name=$("name"); name.textContent=done?"了":list[i];
    var ban=$("ban");
    ban.textContent=kan(i)+"番";
    ban.style.visibility=done?"hidden":"visible";
    if(animate){ name.classList.remove("rise"); void name.offsetWidth; name.classList.add("rise"); }
    requestAnimationFrame(fitName);
    var dots=$("dots"); dots.innerHTML="";
    list.forEach(function(_,k){ var d=document.createElement("i"); d.className="d"+(!done&&k===i?" now":(k<cur?" done":"")); dots.appendChild(d); });
    var nx=$("next");
    if(done) nx.textContent=mode?("全演目おわり — "+PRESET_LABEL[mode]+"はここまで"):"全演目おわり — 待機に戻ると次の家へ";
    else if(i+1<list.length){ nx.innerHTML="次は <b></b>"; nx.querySelector("b").textContent=list[i+1]; }
    else nx.textContent="この演目でおしまいです";
    $("prev").disabled=cur<=0;
    var nb=$("nextBtn"); nb.disabled=done; nb.textContent=(i+1<list.length)?"次の演目へ":"演目を終える"; nb.classList.toggle("fin",i+1>=list.length);
    drawCount(); renderLive();
  }
  $("nextBtn").addEventListener("click",function(){ if(cur<list.length){ cur++; draw(true); pubState(); } });
  $("prev").addEventListener("click",function(){ if(cur>0){ cur--; draw(true); pubState(); } });
  $("reopen").addEventListener("click",function(){
    list=[]; base=[]; cur=0; mode=null; applyMode(); closeList(); draw(false); updateCounts();
    if(pending){ var p=pending; pending=null; load(p.list.filter(Boolean),p.round,true,null); }
  });
  function readCode(){ var l=codeToProg($("codeIn").value); if(!l.length){ toast("コードを確認してください"); return; }
    load(l,Date.now(),true,null); $("codeIn").value=""; }
  $("codeGo").addEventListener("click",readCode);
  $("codeIn").addEventListener("keydown",function(e){ if(e.key==="Enter") readCode(); });

  var tx=0,ty=0;
  document.body.addEventListener("touchstart",function(e){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
  document.body.addEventListener("touchend",function(e){ if(!list.length) return;
    if($("sheet").classList.contains("on")||$("pset").classList.contains("on")||$("addSheet").classList.contains("on")) return;
    var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.6){ if(dx<0&&cur<list.length) cur++; else if(dx>0&&cur>0) cur--; else return; draw(true); pubState(); } },{passive:true});
  document.addEventListener("keydown",function(e){ if(!list.length) return;
    if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); if(cur<list.length){cur++;draw(true);pubState();} }
    if(e.key==="ArrowLeft"){ if(cur>0){cur--;draw(true);pubState();} } });

  applyDevice();
  loadMqtt(function(){ Sync.init(kumi,{ roles:["program","enmoku"],
    onProgram:function(m){ if(!m||!m.list||!m.list.length) return; if(m.round===round) return;
      if(mode){ pending=m; toast("演者から演目が届きました。「モードをえらび直す」で受け取れます"); return; }
      load(m.list.filter(Boolean), m.round, true, null); },
    onEnmoku:function(m){ if(m&&m.list&&m.list.length){ MENU=m.list.slice(); lset("enmoku",JSON.stringify(MENU));
      if($("pset").classList.contains("on")) renderPset();
      if($("addSheet").classList.contains("on")) renderAdd(); } }
  }); });
})();
</script>
</body></html>
